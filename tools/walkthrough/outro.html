<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1280px;height:720px;overflow:hidden;background:#07080b;font-family:Inter,sans-serif;color:#f2f4f7}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 72% 58%,rgba(247,147,26,.22),transparent 60%),radial-gradient(700px 400px at 10% 10%,rgba(255,190,90,.07),transparent 60%),#07080b}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 60% 60%,#000 30%,transparent 75%)}
.coin{position:relative;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 34% 28%,#ffecb0 0%,#fdb94a 34%,#f3951c 58%,#c76c0c 82%,#9a4f07 100%);box-shadow:inset 0 0 0 3px rgba(255,238,190,.6),inset 0 -8px 12px rgba(110,52,0,.45),0 18px 60px -10px rgba(247,147,26,.7)}
.coin::before{content:'';position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(255,242,205,.45)}
.coin svg{position:relative;width:100%;height:100%}
.coin::after{content:'';position:absolute;top:-40%;bottom:-40%;left:-70%;width:45%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 2.4s ease-in-out .9s 1 both}
@keyframes shine{0%{left:-70%}100%{left:130%}}
.word{font-weight:600;letter-spacing:-.03em}.word span{color:#9aa3b2}
.gold{background:linear-gradient(90deg,#ffd27a,#f7931a 55%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
.chart path.l{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 3.2s cubic-bezier(.4,0,.2,1) .3s forwards}
.chart path.a{opacity:0;animation:fade 1.6s ease 1.8s forwards}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tag{display:inline-flex;gap:18px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:#f7b155}
.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid rgba(247,147,26,.28);background:rgba(16,17,22,.72);backdrop-filter:blur(6px);font-size:14px;color:#c9ced8;opacity:0;animation:up .8s ease forwards}
.chip b{color:#f2f4f7;font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}
.foot{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:13px;color:#7d8594}
</style></head><body><div class="bg"></div><div class="grid"></div><svg class="chart" style="opacity:.55" width="1280" height="720" style="position:absolute;inset:0" viewBox="0 0 1280 720"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7931a" stop-opacity=".35"/><stop offset="1" stop-color="#f7931a" stop-opacity="0"/></linearGradient></defs>
