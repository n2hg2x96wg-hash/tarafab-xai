<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three'
const P = new URLSearchParams(location.search)
const W = +(P.get('w') || 2400), H = +(P.get('h') || 1200)
const CX = +(P.get('cx') || 1.55)      // coin x position
const CAMX = +(P.get('camx') || 0)
const FOV = +(P.get('fov') || 28)

// ---------- helpers ----------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296) }
const R = rng(7)
// value noise
const NP = 256, perm = new Uint8Array(NP * 2), grad = new Float32Array(NP)
for (let i = 0; i < NP; i++) { perm[i] = i; grad[i] = R() }
for (let i = NP - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]] }
for (let i = 0; i < NP; i++) perm[i + NP] = perm[i]
const sm = t => t * t * (3 - 2 * t)
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi
  const h = (a, b) => grad[perm[(perm[a & 255] + b) & 255]]
  const u = sm(xf), v = sm(yf)
  return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v
}
function fbm(x, y, o = 6) { let a = 0.5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5 } return s }
function ridged(x, y, o = 6) { let a = 0.5, f = 1, s = 0; for (let i = 0; i < o; i++) { const n = 1 - Math.abs(vnoise(x * f, y * f) * 2 - 1); s += a * n * n; f *= 2.1; a *= 0.5 } return s }

// ---------- coin face height map (₿ + rings) ----------
const HS = 2048
const hc = document.createElement('canvas'); hc.width = hc.height = HS
const hx = hc.getContext('2d')
hx.fillStyle = '#000'; hx.fillRect(0, 0, HS, HS)
const C = HS / 2, Rf = HS / 2  // face radius maps to plane half-size
function ring(r, w, v) { hx.beginPath(); hx.arc(C, C, r, 0, Math.PI * 2); hx.lineWidth = w; hx.strokeStyle = `rgb(${v},${v},${v})`; hx.stroke() }
hx.filter = 'blur(6px)'
ring(Rf * 0.86, Rf * 0.035, 210)
// dotted ring
for (let i = 0; i < 120; i++) { const a = i / 120 * Math.PI * 2; hx.beginPath(); hx.arc(C + Math.cos(a) * Rf * 0.79, C + Math.sin(a) * Rf * 0.79, Rf * 0.0085, 0, Math.PI * 2); hx.fillStyle = 'rgb(150,150,150)'; hx.fill() }
// Bitcoin symbol (path in a 0..1 box, tilted like the logo)
const B = new Path2D('M-92,-196 h36 v-46 h40 v46 h30 v-46 h40 v50 c78,10 122,48 122,104 c0,44 -26,74 -66,86 c56,12 90,50 90,104 c0,78 -60,124 -160,128 v48 h-40 v-48 h-30 v48 h-40 v-48 h-36 z M-24,-130 v96 h76 c40,0 64,-18 64,-48 c0,-30 -24,-48 -64,-48 z M-24,30 v104 h88 c46,0 72,-20 72,-52 c0,-32 -26,-52 -72,-52 z')
hx.save(); hx.translate(C - Rf * 0.03, C + Rf * 0.02); hx.rotate(14 * Math.PI / 180); const sc = Rf * 0.0021; hx.scale(sc, sc); hx.translate(-36, -20)
hx.filter = 'blur(10px)'; hx.fillStyle = 'rgb(255,255,255)'; hx.fill(B, 'evenodd'); hx.restore()
hx.filter = 'none'
// normal map from height (Sobel)
const hd = hx.getImageData(0, 0, HS, HS).data
const nc = document.createElement('canvas'); nc.width = nc.height = HS
const nx = nc.getContext('2d'); const nd = nx.createImageData(HS, HS)
const hAt = (x, y) => hd[((Math.min(HS - 1, Math.max(0, y)) * HS) + Math.min(HS - 1, Math.max(0, x))) * 4] / 255
const strength = 9
for (let y = 0; y < HS; y++) for (let x = 0; x < HS; x++) {
  const dx = (hAt(x + 1, y) - hAt(x - 1, y)) * strength, dy = (hAt(x, y + 1) - hAt(x, y - 1)) * strength
  let X = -dx, Y = dy, Z = 1; const l = Math.hypot(X, Y, Z); X /= l; Y /= l; Z /= l
  const i = (y * HS + x) * 4; nd.data[i] = (X * 0.5 + 0.5) * 255; nd.data[i + 1] = (Y * 0.5 + 0.5) * 255; nd.data[i + 2] = (Z * 0.5 + 0.5) * 255; nd.data[i + 3] = 255
}
nx.putImageData(nd, 0, 0)
// roughness map: raised areas polished, field finely turned (concentric) and slightly worn
const rc = document.createElement('canvas'); rc.width = rc.height = 1024
const rx = rc.getContext('2d'); const rd = rx.createImageData(1024, 1024)
for (let y = 0; y < 1024; y++) for (let x = 0; x < 1024; x++) {
  const u = (x - 512) / 512, v = (y - 512) / 512, r = Math.hypot(u, v)
  const raised = hAt(Math.round(x * 2), Math.round(y * 2))
  const turned = 0.5 + 0.5 * Math.sin(r * 900)
  let rough = 0.26 + turned * 0.05 + fbm(x / 60, y / 60, 3) * 0.05
  rough = rough * (1 - raised * 0.55)
  const i = (y * 1024 + x) * 4; const g = Math.max(0, Math.min(255, rough * 255))
  rd.data[i] = rd.data[i + 1] = rd.data[i + 2] = g; rd.data[i + 3] = 255
}
rx.putImageData(rd, 0, 0)

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1); renderer.setSize(W, H)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x050506)

// environment for reflections: dark room with warm softboxes
const envScene = new THREE.Scene()
envScene.background = new THREE.Color(0x030303)
const box = (w, h, color, intensity, pos, look) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(...look); envScene.add(m) }
box(6, 3, 0xffd9a0, 6, [6, 7, 4], [0, 0, 0])         // warm key softbox, top right front
box(4, 6, 0xffb35a, 2.2, [-7, 2, -5], [0, 0, 0])      // warm rim, back left
box(10, 1, 0xfff1d6, 1.4, [0, 9, -3], [0, 0, 0])      // top strip
box(6, 2, 0x6f5233, 0.5, [0, -3, 6], [0, 0, 0])       // floor bounce
box(3, 3, 0x9fb6d6, 0.25, [-8, 3, 6], [0, 0, 0])      // faint cool fill, left
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(envScene, 0.02).texture

// camera
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 100)
camera.position.set(CAMX, 1.0, 7.0)
camera.lookAt(CAMX * 0.6, 0.85, 0)

// ---------- rocks ----------
// stones: rounded, faceted boulders scattered over a low gritty bed
const STONES = []
{ const SR = rng(11)
  for (let i = 0; i < 260; i++) {
    const x = -9 + SR() * 18, z = -5 + SR() * 9.5
    const near = Math.hypot(x - CX, z + 0.15)
    if (near < 0.75) continue                      // clear spot where the coin stands
    const r = (0.18 + Math.pow(SR(), 2.2) * 0.85) * (z > 1.2 ? 0.7 : 1)
    STONES.push({ x, z, r, rx: r * (0.8 + SR() * 0.6), rz: r * (0.7 + SR() * 0.6), hgt: r * (0.45 + SR() * 0.35), rot: SR() * Math.PI, seed: SR() * 50 })
  }
  // two stones the coin leans against
  STONES.push({ x: CX + 0.15, z: -0.75, r: 0.75, rx: 0.9, rz: 0.55, hgt: 0.55, rot: 0.3, seed: 3 })
  STONES.push({ x: CX - 0.85, z: -0.55, r: 0.5, rx: 0.55, rz: 0.45, hgt: 0.35, rot: 1.2, seed: 8 })
}
function terrain(x, z) {
  let h = fbm(x * 1.4 + 2, z * 1.4 + 7, 4) * 0.14 + fbm(x * 12, z * 12, 2) * 0.012
  for (const st of STONES) {
    const dx = x - st.x, dz = z - st.z
    if (dx * dx + dz * dz > (st.r * 1.3) * (st.r * 1.3)) continue
    const c = Math.cos(st.rot), sn = Math.sin(st.rot)
    const u = (dx * c - dz * sn) / st.rx, v = (dx * sn + dz * c) / st.rz
    let d = u * u + v * v
    if (d >= 1) continue
    // faceted dome: noise-quantised surface
    const n = vnoise(x * 4 + st.seed, z * 4 - st.seed)
    let y = Math.sqrt(1 - d) * st.hgt * (0.82 + n * 0.3)
    y += (ridged(x * 3.2 + st.seed, z * 3.2 - st.seed, 3) - 0.35) * 0.05 * st.r
    if (y > h) h = y
  }
  return h - 0.18
}
const gw = 22, gd = 12, gsx = 900, gsy = 520
const g = new THREE.PlaneGeometry(gw, gd, gsx, gsy)
g.rotateX(-Math.PI / 2)
const pos = g.attributes.position
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i)
  pos.setY(i, terrain(x, z))
}
g.computeVertexNormals()
// rock colour: near-black basalt with warm highlights
const cols = new Float32Array(pos.count * 3)
for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), z = pos.getZ(i); const n = fbm(x * 3, z * 3, 3); const c = 0.006 + n * 0.014; cols[i * 3] = c * 1.12; cols[i * 3 + 1] = c * 1.0; cols[i * 3 + 2] = c * 0.9 }
g.setAttribute('color', new THREE.BufferAttribute(cols, 3))
const rocks = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.48, metalness: 0.0, envMapIntensity: 1.1 }))
rocks.receiveShadow = true; rocks.castShadow = true
scene.add(rocks)
function groundY(x, z) { return terrain(x, z) }

// ---------- coin ----------
const T = 0.075            // half thickness
const gold = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(1.0, 0.74, 0.33), metalness: 1, roughness: 0.24, envMapIntensity: 1.45 })
const goldEdge = gold.clone(); goldEdge.roughness = 0.34
// rim + body via lathe (raised rim, recessed field)
const prof = [
  [0.0, T - 0.006], [0.855, T - 0.006], [0.875, T + 0.012], [0.955, T + 0.016], [0.985, T + 0.006], [1.0, T - 0.01],
  [1.0, -T + 0.01], [0.985, -T - 0.006], [0.955, -T - 0.016], [0.875, -T - 0.012], [0.855, -T + 0.006], [0.0, -T + 0.006],
].map(([r, y]) => new THREE.Vector2(r, y))
const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 512), gold)
// reeded edge band
const eg = new THREE.CylinderGeometry(1.0, 1.0, 2 * T - 0.02, 1600, 1, true)
const ep = eg.attributes.position
for (let i = 0; i < ep.count; i++) { const x = ep.getX(i), z = ep.getZ(i); const a = Math.atan2(z, x); const r = 1.0015 - 0.006 * (0.5 + 0.5 * Math.cos(a * 180)); ep.setX(i, Math.cos(a) * r); ep.setZ(i, Math.sin(a) * r) }
eg.computeVertexNormals()
const edge = new THREE.Mesh(eg, goldEdge)
// face with relief
const tex = (cv, srgb = false) => { const t = new THREE.CanvasTexture(cv); t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t }
const heightTex = tex(hc), normalTex = tex(nc), roughTex = tex(rc)
function face(side) {
  const fg = new THREE.CircleGeometry(0.862, 720)
  // subdivide by using a dense plane masked to a circle instead (better displacement)
  const pg = new THREE.PlaneGeometry(1.724, 1.724, 900, 900)
  const m = new THREE.MeshPhysicalMaterial({ color: gold.color, metalness: 1, roughness: 1, roughnessMap: roughTex, normalMap: normalTex, normalScale: new THREE.Vector2(1.2, 1.2), displacementMap: heightTex, displacementScale: 0.028, envMapIntensity: 1.35, alphaTest: 0.5, transparent: false })
  // circular mask
  const mc = document.createElement('canvas'); mc.width = mc.height = 512; const mx = mc.getContext('2d'); mx.fillStyle = '#000'; mx.fillRect(0, 0, 512, 512); mx.fillStyle = '#fff'; mx.beginPath(); mx.arc(256, 256, 255, 0, Math.PI * 2); mx.fill()
  m.alphaMap = tex(mc)
  const mesh = new THREE.Mesh(pg, m)
  mesh.rotation.x = side > 0 ? -Math.PI / 2 : Math.PI / 2
  mesh.position.y = side * (T - 0.006)
  return mesh
}
const coin = new THREE.Group()
coin.add(body, edge, face(1), face(-1))
coin.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true } })
// stand the coin up, leaning back onto the rocks, turned toward the camera-left
const lean = +(P.get('lean') || 0.30), turn = +(P.get('turn') || -0.42)
coin.rotation.set(Math.PI / 2 - lean, 0, 0)
const holder = new THREE.Group(); holder.add(coin)
holder.rotation.y = turn
const baseZ = -0.15
const by = groundY(CX, baseZ)
holder.position.set(CX, by + Math.cos(lean) * 1.0 + Math.sin(lean) * T - 0.02, baseZ)
scene.add(holder)

// second coin lying among the rocks, front-left, smaller in frame
if (P.get('second') !== '0') {
  const c2 = coin.clone(true)
  const h2 = new THREE.Group(); h2.add(c2); c2.rotation.set(0.22, 0.9, -0.16)
  const sx = CX + (+(P.get('s2x') || -1.35)), sz = +(P.get('s2z') || 0.85)
  h2.position.set(sx, groundY(sx, sz) + 0.2, sz); h2.scale.setScalar(0.55); c2.rotation.set(0.75, 0.35, -0.12)
  scene.add(h2)
}

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffdcb0, 3.6)
key.position.set(3.2, 5.2, 5.5); key.target.position.set(CX, 0.6, 0)
key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6; key.shadow.bias = -0.0004; key.shadow.radius = 4
scene.add(key, key.target)
const rim = new THREE.SpotLight(0xff9b3d, 60, 20, 0.5, 0.6, 1.5)
rim.position.set(CX - 3.5, 3.2, -4.5); rim.target.position.set(CX, 0.8, 0); scene.add(rim, rim.target)
const fill = new THREE.PointLight(0xffc27a, 6, 10, 2); fill.position.set(CX + 1.8, 1.4, 2.6); scene.add(fill)
scene.add(new THREE.HemisphereLight(0x2a241c, 0x020202, 0.18))

renderer.render(scene, camera)
// depth pass (linear, 0 = near .. 1 = far) for a lens-like depth of field
const beauty = document.createElement('canvas'); beauty.width = W; beauty.height = H
beauty.getContext('2d').drawImage(renderer.domElement, 0, 0)
const NEAR = 3, FAR = 16
scene.overrideMaterial = new THREE.ShaderMaterial({
  vertexShader: 'varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vD = -mv.z; gl_Position = projectionMatrix * mv; }',
  fragmentShader: `varying float vD; void main(){ float d = clamp((vD - ${NEAR.toFixed(1)}) / ${(FAR - NEAR).toFixed(1)}, 0.0, 1.0); gl_FragColor = vec4(vec3(d), 1.0); }`,
})
// displaced faces need their own depth: keep it simple, faces are at the coin's depth anyway
const bg = scene.background; scene.background = new THREE.Color(1, 1, 1)
renderer.toneMapping = THREE.NoToneMapping; renderer.outputColorSpace = THREE.LinearSRGBColorSpace
renderer.render(scene, camera)
const depth = document.createElement('canvas'); depth.width = W; depth.height = H
depth.getContext('2d').drawImage(renderer.domElement, 0, 0)
scene.overrideMaterial = null; scene.background = bg
const focusD = (camera.position.distanceTo(holder.position) - NEAR) / (FAR - NEAR)
{ const bx = beauty.getContext('2d')
  const blurred = document.createElement('canvas'); blurred.width = W; blurred.height = H
  const bl = blurred.getContext('2d'); bl.filter = `blur(${Math.round(W / 260)}px)`; bl.drawImage(beauty, 0, 0); bl.filter = 'none'
  const blurred2 = document.createElement('canvas'); blurred2.width = W; blurred2.height = H
  const b2 = blurred2.getContext('2d'); b2.filter = `blur(${Math.round(W / 110)}px)`; b2.drawImage(beauty, 0, 0); b2.filter = 'none'
  const S = bx.getImageData(0, 0, W, H), B1 = bl.getImageData(0, 0, W, H).data, B2 = b2.getImageData(0, 0, W, H).data
  const D = depth.getContext('2d').getImageData(0, 0, W, H).data
  for (let i = 0; i < S.data.length; i += 4) {
    const dd = D[i] / 255
    const coc = Math.min(1, Math.max(0, Math.abs(dd - focusD) - 0.025) * (dd < focusD ? 4.2 : 3.0))
    const a = Math.min(1, coc * 2), b = Math.max(0, coc * 2 - 1)
    for (let k = 0; k < 3; k++) {
      const m1 = S.data[i + k] * (1 - a) + B1[i + k] * a
      S.data[i + k] = m1 * (1 - b) + B2[i + k] * b
    }
  }
  bx.putImageData(S, 0, 0)
}

// ---------- photographic finish: bokeh, vignette, grain ----------
const out = document.createElement('canvas'); out.width = W; out.height = H
const o = out.getContext('2d')
// background glow + bokeh behind the scene (screen blend on dark areas)
o.drawImage(beauty, 0, 0)
o.globalCompositeOperation = 'screen'
const glow = o.createRadialGradient(W * (0.5 + CX * 0.13), H * 0.28, 10, W * (0.5 + CX * 0.13), H * 0.28, W * 0.45)
glow.addColorStop(0, 'rgba(255,170,70,0.20)'); glow.addColorStop(0.5, 'rgba(200,110,30,0.06)'); glow.addColorStop(1, 'rgba(0,0,0,0)')
o.fillStyle = glow; o.fillRect(0, 0, W, H)
const BR = rng(19)
o.filter = 'blur(10px)'
for (let i = 0; i < 26; i++) {
  const x = W * (0.35 + BR() * 0.65), y = H * (0.04 + BR() * 0.42), r = H * (0.008 + BR() * 0.03)
  const a = 0.05 + BR() * 0.16
  o.fillStyle = `rgba(255,${150 + Math.floor(BR() * 60)},${60 + Math.floor(BR() * 50)},${a})`
  o.beginPath(); o.arc(x, y, r, 0, Math.PI * 2); o.fill()
}
o.filter = 'none'
o.globalCompositeOperation = 'source-over'
// vignette
const vg = o.createRadialGradient(W * 0.62, H * 0.48, H * 0.25, W * 0.55, H * 0.5, W * 0.8)
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.72)')
o.fillStyle = vg; o.fillRect(0, 0, W, H)
// grain
const gd2 = o.getImageData(0, 0, W, H); const GR = rng(5)
for (let i = 0; i < gd2.data.length; i += 4) { const n = (GR() - 0.5) * 7; gd2.data[i] += n; gd2.data[i + 1] += n; gd2.data[i + 2] += n }
o.putImageData(gd2, 0, 0)
window.__done = out.toDataURL('image/png')
</script></body></html>
