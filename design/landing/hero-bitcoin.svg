<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<defs>
  <radialGradient id="bg" cx="0.66" cy="0.30" r="0.95">
    <stop offset="0" stop-color="#2b1e0c"/><stop offset="0.22" stop-color="#17120b"/>
    <stop offset="0.55" stop-color="#0d0e11"/><stop offset="1" stop-color="#07080a"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f3ad45" stop-opacity="0.22"/><stop offset="0.6" stop-color="#e08a1a" stop-opacity="0.05"/><stop offset="1" stop-color="#e08a1a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="face" cx="0.30" cy="0.24" r="0.95">
    <stop offset="0" stop-color="#fff3cf"/><stop offset="0.14" stop-color="#f7d57f"/>
    <stop offset="0.38" stop-color="#e5a83e"/><stop offset="0.62" stop-color="#b9781d"/>
    <stop offset="0.84" stop-color="#7d4d0f"/><stop offset="1" stop-color="#4f2f07"/>
  </radialGradient>
  <!-- turned-metal concentric grain -->
  <radialGradient id="turn" cx="0.5" cy="0.5" r="0.006" spreadMethod="repeat">
    <stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="0.5" stop-color="#000" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0.10"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0.30" stop-color="#fff" stop-opacity="0"/><stop offset="0.42" stop-color="#fff6dc" stop-opacity="0.30"/>
    <stop offset="0.50" stop-color="#fff" stop-opacity="0"/><stop offset="0.70" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.78" stop-color="#ffd98a" stop-opacity="0.12"/><stop offset="0.86" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.45"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3e2506"/><stop offset="0.35" stop-color="#7c4c0f"/>
    <stop offset="0.62" stop-color="#c58a2c"/><stop offset="0.80" stop-color="#e9b558"/><stop offset="1" stop-color="#6b420b"/>
  </linearGradient>
  <linearGradient id="rim" x1="0.12" y1="0.08" x2="0.9" y2="0.95">
    <stop offset="0" stop-color="#fff0bd"/><stop offset="0.28" stop-color="#e0a13a"/>
    <stop offset="0.62" stop-color="#8a5512"/><stop offset="0.88" stop-color="#c88f2e"/><stop offset="1" stop-color="#ffd27a"/>
  </linearGradient>
  <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
    <feSpecularLighting in="b" surfaceScale="9" specularConstant="1.1" specularExponent="26" lighting-color="#fff6dc" result="s">
      <fePointLight x="330" y="90" z="460"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
    <feDiffuseLighting in="b" surfaceScale="8" diffuseConstant="1.15" lighting-color="#f0b24c" result="d">
      <feDistantLight azimuth="225" elevation="35"/>
    </feDiffuseLighting>
    <feComposite in="d" in2="SourceAlpha" operator="in" result="dIn"/>
    <feComposite in="sIn" in2="dIn" operator="arithmetic" k1="0" k2="0.75" k3="0.9" k4="0"/>
  </filter>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dx="10" dy="12" result="o"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
  <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="noise" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
  </filter>
  <clipPath id="faceClip"><circle r="372"/></clipPath><clipPath id="rimClip"><circle r="399"/></clipPath>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#121214"/><stop offset="1" stop-color="#050506"/>
  </linearGradient>
  <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d79a35" stop-opacity="0.22"/><stop offset="1" stop-color="#d79a35" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<g filter="url(#bokeh)">
  <circle cx="1340" cy="220" r="15" fill="#f5b04a" opacity="0.22"/><circle cx="1440" cy="380" r="8" fill="#f5b04a" opacity="0.16"/>
  <circle cx="1210" cy="120" r="6" fill="#ffd27a" opacity="0.18"/><circle cx="320" cy="200" r="9" fill="#d9902a" opacity="0.10"/>
</g>
<ellipse cx="1050" cy="530" rx="560" ry="440" fill="url(#halo)"/>
<!-- glossy surface -->
<path d="M0 960 L1600 935 L1600 1200 L0 1200 Z" fill="url(#floor)"/>
<path d="M0 960 L1600 935" stroke="#3a2a14" stroke-opacity="0.35" stroke-width="2"/>
<!-- reflection of the coin on the surface -->
<ellipse cx="1040" cy="1000" rx="265" ry="62" fill="url(#refl)" filter="url(#soft2)"/>
<!-- contact + cast shadow -->
<ellipse cx="1062" cy="952" rx="318" ry="24" fill="#000" opacity="0.85" filter="url(#soft2)"/>
<ellipse cx="1125" cy="968" rx="415" ry="54" fill="#000" opacity="0.55" filter="url(#soft)"/>

<g transform="translate(1040 560) scale(0.88) rotate(-12) scale(0.84 1)">
