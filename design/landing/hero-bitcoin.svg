idth="3" stroke-dasharray="2 5"/></g><g transform="translate(28.75 15.50)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(27.60 14.88)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(26.45 14.26)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(25.30 13.64)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(24.15 13.02)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(23.00 12.40)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(21.85 11.78)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(20.70 11.16)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(19.55 10.54)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(18.40 9.92)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(17.25 9.30)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(16.10 8.68)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(14.95 8.06)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(13.80 7.44)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(12.65 6.82)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(11.50 6.20)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(10.35 5.58)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(9.20 4.96)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(8.05 4.34)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(6.90 3.72)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(5.75 3.10)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(4.60 2.48)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(3.45 1.86)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(2.30 1.24)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g><g transform="translate(1.15 0.62)"><circle r="400" fill="url(#edge)"/><circle r="399" fill="none" stroke="#2a1803" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="2 5"/></g>
  <circle r="400" fill="url(#rim)"/>
  <circle r="396" fill="none" stroke="#fff3c9" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle r="372" fill="url(#face)"/>
  <g clip-path="url(#faceClip)">
    <circle r="372" fill="url(#turn)"/>
    <rect x="-400" y="-400" width="800" height="800" filter="url(#noise)"/>
    <rect x="-400" y="-400" width="800" height="800" fill="url(#sheen)"/>
  </g>
  <circle r="372" fill="none" stroke="#5a3608" stroke-opacity="0.6" stroke-width="4"/>
  <circle r="369" fill="none" stroke="#ffe3a0" stroke-opacity="0.25" stroke-width="2" transform="translate(-2 -2)"/>
  <!-- inner raised ring -->
  <g filter="url(#emboss)"><circle r="320" fill="none" stroke="#e3a43c" stroke-width="15"/></g>
  <!-- symbol: cast shadow, then lit relief -->
  <g transform="translate(0 4) rotate(12)">
    <path d="M-92,-196 h36 v-46 h40 v46 h30 v-46 h40 v50
          c78,10 122,48 122,104 c0,44 -26,74 -66,86
          c56,12 90,50 90,104 c0,78 -60,124 -160,128
          v48 h-40 v-48 h-30 v48 h-40 v-48 h-36 z
          M-24,-130 v96 h76 c40,0 64,-18 64,-48 c0,-30 -24,-48 -64,-48 z
          M-24,30 v104 h88 c46,0 72,-20 72,-52 c0,-32 -26,-52 -72,-52 z" fill-rule="evenodd" filter="url(#drop)"/>
    <g filter="url(#emboss)"><path d="M-92,-196 h36 v-46 h40 v46 h30 v-46 h40 v50
          c78,10 122,48 122,104 c0,44 -26,74 -66,86
          c56,12 90,50 90,104 c0,78 -60,124 -160,128
          v48 h-40 v-48 h-30 v48 h-40 v-48 h-36 z
          M-24,-130 v96 h76 c40,0 64,-18 64,-48 c0,-30 -24,-48 -64,-48 z
          M-24,30 v104 h88 c46,0 72,-20 72,-52 c0,-32 -26,-52 -72,-52 z" fill="#e8ab42" fill-rule="evenodd"/></g>
  </g>
  <!-- shading toward lower right, rim highlight -->
  <circle r="400" fill="url(#shade)"/>
  <path d="M-300,-250 A392,392 0 0 1 40,-389" fill="none" stroke="#fffbea" stroke-width="4" stroke-linecap="round" opacity="0.55" filter="url(#soft3)" clip-path="url(#rimClip)"/>
  <path d="M380,120 A400,400 0 0 1 250,312" fill="none" stroke="#ffcf73" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#soft3)"/>
